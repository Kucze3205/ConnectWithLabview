name: Environment readiness

on:
  push:
    branches: [perpetua/setup]
    paths:
      - '.github/loop/prepare.sh'
      - '.github/loop/prepare_environment.py'
      - '.github/loop/environment-sources.json'
      - '.github/loop/cloud-providers.json'
      - '.github/loop/cloud_probe.py'
      - '.github/loop/credential_store.py'
      - '.github/loop/probe_isolation.py'
      - '.github/loop/provider_adapter.py'
      - '.github/loop/provider_rpc.py'
      - '.github/loop/provider_contract.py'
      - '.github/loop/tool_broker.py'
      - '.github/loop/runtime_store.py'
      - '.github/loop/provider_pool.py'
      - '.github/loop/role_runtime.py'
      - '.github/loop/runtime_checkpoint.py'
      - '.github/loop/runtime_entry.py'
      - '.github/loop/runtime_smoke.py'
      - '.github/loop/tests/**'
      - '.github/workflows/environment.yml'
      - '.github/workflows/credential-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Prepare kernel boundary checks
        run: bash .github/loop/sandbox.sh
      - name: Test engine contracts without provider credentials
        env:
          LOOP_BROKER_INTEGRATION: '1'
        # Two invocations, together the whole suite. The executor boundary test plants canary copies in system
        # directories (/usr/bin, /usr/local/share) that an unprivileged runner user cannot write, so it runs as root.
        # Everything else stays unprivileged: bwrap run as root cannot read the runner's checkout (model boundary test).
        run: |
          export PYTHONPATH="$PWD/.github/loop/tests:$PWD/.github/loop"
          others=$(cd .github/loop/tests && ls test_*.py | grep -v '^test_executor_boundary\.py$' | sed 's/\.py$//')
          status=0
          sudo -E env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" python3 -m unittest -v test_executor_boundary || status=1
          python3 -m unittest -v $others || status=1
          exit $status

  public-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare and check a second invocation
        run: |
          bash .github/loop/prepare.sh
          bash .github/loop/prepare.sh
      - uses: actions/upload-artifact@v4
        with:
          name: public-environment-readiness
          path: ${{ runner.temp }}/connectwithlabview-environment/readiness.json

  providers:
    # Credentials never reach PR or arbitrary-ref jobs. The owner retained the
    # public repository; selected-branch environment rules are an additional gate.
    if: github.repository == 'Kucze3205/ConnectWithLabview' && github.actor == github.repository_owner && (github.ref == 'refs/heads/perpetua/setup' || github.ref_name == github.event.repository.default_branch)
    permissions:
      contents: read
      copilot-requests: write
    strategy:
      fail-fast: false
      matrix:
        provider: [claude, codex, copilot]
    runs-on: ubuntu-24.04
    environment: provider-${{ matrix.provider }}
    concurrency:
      group: provider-credential-${{ matrix.provider }}
      cancel-in-progress: false
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned CLI
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          PACKAGE=$(python3 -c 'import json,os; p=json.load(open(".github/loop/cloud-providers.json"))[os.environ["PROVIDER"]]; print(p["package"]+"@"+p["version"])')
          npm install --global "$PACKAGE"
      - name: Verify model-probe isolation
        run: |
          bash .github/loop/sandbox.sh
          python3 .github/loop/probe_isolation.py
      - name: Store authority (never passed to the model)
        id: store-token
        if: matrix.provider == 'codex' && vars.CODEX_CREDENTIAL_STORE_READY == 'on'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CREDENTIAL_STORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CREDENTIAL_STORE_APP_PRIVATE_KEY }}
          permission-environments: write
      - name: Restore dedicated CI credentials
        id: restore
        if: matrix.provider == 'codex' && vars.CODEX_CREDENTIAL_STORE_READY == 'on'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_CI_AUTH_JSON }}
        run: python3 .github/loop/credential_store.py restore --home "$RUNNER_TEMP/codex-private-auth"
      - name: Lease credential before it can rotate
        id: lease
        if: matrix.provider == 'codex' && vars.CODEX_CREDENTIAL_STORE_READY == 'on'
        env:
          CREDENTIAL_STORE_TOKEN: ${{ steps.store-token.outputs.token }}
        run: python3 .github/loop/credential_store.py lease --home "$RUNNER_TEMP/codex-private-auth"
      - name: Renew through Codex (no model prompt)
        id: refresh
        if: matrix.provider == 'codex' && vars.CODEX_CREDENTIAL_STORE_READY == 'on'
        run: python3 .github/loop/credential_store.py refresh --home "$RUNNER_TEMP/codex-private-auth"
      - name: Check actual model response
        id: probe
        continue-on-error: true
        env:
          PROVIDER: ${{ matrix.provider }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.provider == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          CODEX_AUTH_JSON: ${{ matrix.provider == 'codex' && secrets.CODEX_AUTH_JSON || '' }}
          # This personally owned repository bills the owner's existing seat.
          # The token expires with the job; no copied personal OAuth token.
          COPILOT_GITHUB_TOKEN: ${{ matrix.provider == 'copilot' && github.token || '' }}
          CODEX_CREDENTIAL_STORE_READY: ${{ vars.CODEX_CREDENTIAL_STORE_READY }}
        run: |
          if [ "$PROVIDER" = codex ] && [ "$CODEX_CREDENTIAL_STORE_READY" = on ]; then
            python3 .github/loop/cloud_probe.py codex --codex-home "$RUNNER_TEMP/codex-private-auth" --output "$RUNNER_TEMP/provider-readiness.json"
          else
            python3 .github/loop/cloud_probe.py "$PROVIDER" --output "$RUNNER_TEMP/provider-readiness.json"
          fi
      - name: Check structured transport and live model catalog
        env:
          PROVIDER: ${{ matrix.provider }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.provider == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          COPILOT_GITHUB_TOKEN: ${{ matrix.provider == 'copilot' && github.token || '' }}
          CODEX_CREDENTIAL_STORE_READY: ${{ vars.CODEX_CREDENTIAL_STORE_READY }}
        run: |
          if [ "$PROVIDER" = codex ] && [ "$CODEX_CREDENTIAL_STORE_READY" = on ]; then
            python3 .github/loop/provider_contract.py codex --codex-home "$RUNNER_TEMP/codex-private-auth" --output "$RUNNER_TEMP/provider-contract.json"
          elif [ "$PROVIDER" = copilot ]; then
            python3 .github/loop/provider_contract.py copilot --model gpt-5.6-luna --output "$RUNNER_TEMP/provider-contract.json"
          else
            python3 .github/loop/provider_contract.py "$PROVIDER" --output "$RUNNER_TEMP/provider-contract.json"
          fi
      - name: Persist refreshed credentials even after model failure
        if: always() && steps.lease.outcome == 'success' && steps.refresh.outcome == 'success'
        env:
          CREDENTIAL_STORE_TOKEN: ${{ steps.store-token.outputs.token }}
        run: python3 .github/loop/credential_store.py persist --home "$RUNNER_TEMP/codex-private-auth"
      - name: Publish access-only credential for execution (no refresh or store authority)
        if: always() && steps.lease.outcome == 'success' && steps.refresh.outcome == 'success'
        env:
          CREDENTIAL_STORE_TOKEN: ${{ steps.store-token.outputs.token }}
        run: python3 .github/loop/credential_store.py publish-worker --home "$RUNNER_TEMP/codex-private-auth"
      - name: Remove private credential file
        if: always() && steps.restore.outcome == 'success'
        run: python3 .github/loop/credential_store.py remove --home "$RUNNER_TEMP/codex-private-auth"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-${{ matrix.provider }}-readiness
          path: |
            ${{ runner.temp }}/provider-readiness.json
            ${{ runner.temp }}/provider-contract.json

  maintenance-proof:
    needs: engine-tests
    if: needs.engine-tests.result == 'success' && github.repository == 'Kucze3205/ConnectWithLabview' && github.actor == github.repository_owner && github.ref == 'refs/heads/perpetua/setup'
    uses: ./.github/workflows/credential-maintenance.yml
    with:
      setup_check: true
    secrets: inherit

  runtime-proof:
    needs: [engine-tests, providers, maintenance-proof]
    if: always() && needs.engine-tests.result == 'success' && github.repository == 'Kucze3205/ConnectWithLabview' && github.actor == github.repository_owner && github.ref == 'refs/heads/perpetua/setup'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        role: [worker, policymaker]
    environment: provider-claude
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare trusted runtime
        run: |
          pip install -q pyyaml
          python3 -c 'import json,subprocess; catalog=json.load(open(".github/loop/cloud-providers.json")); [subprocess.run(["npm","install","-g",p["package"]+"@"+p["version"]],check=True) for k,p in catalog.items() if k in ("claude","codex")]'
          bash .github/loop/sandbox.sh
      - name: Real fallback, role tools and remote checkpoint restore
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_WORKER_AUTH_JSON: ${{ secrets.CODEX_WORKER_AUTH_JSON }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROOF_ROLE: ${{ matrix.role }}
        run: |
          if [ "$PROOF_ROLE" = policymaker ]; then
            python3 .github/loop/runtime_smoke.py --policymaker
          else
            python3 .github/loop/runtime_smoke.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-proof-${{ matrix.role }}
          path: ${{ runner.temp }}/runtime-proof.json

  runtime-resume:
    needs: [engine-tests, runtime-proof]
    if: always() && needs.engine-tests.result == 'success' && github.repository == 'Kucze3205/ConnectWithLabview' && github.actor == github.repository_owner && github.ref == 'refs/heads/perpetua/setup'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        role: [worker, policymaker]
    concurrency:
      group: runtime-recovery-${{ matrix.role }}
      cancel-in-progress: false
    environment: provider-claude
    permissions:
      contents: write
      copilot-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare independent resume runner
        run: |
          pip install -q pyyaml
          PACKAGE=$(python3 -c 'import json; p=json.load(open(".github/loop/cloud-providers.json"))["copilot"]; print(p["package"]+"@"+p["version"])')
          npm install -g "$PACKAGE"
          bash .github/loop/sandbox.sh
      - name: Copilot continues the remotely saved Codex task
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROOF_ROLE: ${{ matrix.role }}
          # This previously verified checkpoint keeps recovery testable when
          # current subscription capacity prevents creating another fixture.
          RESUME_SOURCE_RUN: ${{ needs.runtime-proof.result == 'success' && github.run_id || '39115592839' }}
        run: |
          if [ "$PROOF_ROLE" = policymaker ]; then
            python3 .github/loop/runtime_smoke.py --resume --policymaker
          else
            python3 .github/loop/runtime_smoke.py --resume
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-resume-${{ matrix.role }}
          path: ${{ runner.temp }}/runtime-resume.json
