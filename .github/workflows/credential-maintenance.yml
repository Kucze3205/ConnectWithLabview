name: Trusted credential maintenance

on:
  workflow_call:
    inputs:
      setup_check:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  codex:
    if: (vars.AUTOPILOT == 'on' || inputs.setup_check) && github.repository == 'Kucze3205/ConnectWithLabview' && (github.ref == 'refs/heads/perpetua/setup' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    environment: provider-codex
    concurrency:
      group: provider-credential-codex
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.setup_check && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned maintenance CLI
        run: |
          PACKAGE=$(python3 -c 'import json; p=json.load(open(".github/loop/cloud-providers.json"))["codex"]; print(p["package"]+"@"+p["version"])')
          npm install -g "$PACKAGE"
      - name: Store authority
        id: store-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CREDENTIAL_STORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CREDENTIAL_STORE_APP_PRIVATE_KEY }}
          permission-environments: write
      - name: Restore latest dedicated credential
        id: restore
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_CI_AUTH_JSON }}
        run: python3 .github/loop/credential_store.py restore --home "$RUNNER_TEMP/codex-private-auth"
      - name: Lease before renewal
        id: lease
        env:
          CREDENTIAL_STORE_TOKEN: ${{ steps.store-token.outputs.token }}
        run: python3 .github/loop/credential_store.py lease --home "$RUNNER_TEMP/codex-private-auth"
      - name: Renew without model inference
        id: refresh
        run: python3 .github/loop/credential_store.py refresh --home "$RUNNER_TEMP/codex-private-auth"
      - name: Retain refreshed credential
        if: always() && steps.lease.outcome == 'success' && steps.refresh.outcome == 'success'
        env:
          CREDENTIAL_STORE_TOKEN: ${{ steps.store-token.outputs.token }}
        run: python3 .github/loop/credential_store.py persist --home "$RUNNER_TEMP/codex-private-auth"
      - name: Publish access-only worker credential
        if: always() && steps.lease.outcome == 'success' && steps.refresh.outcome == 'success'
        env:
          CREDENTIAL_STORE_TOKEN: ${{ steps.store-token.outputs.token }}
        run: python3 .github/loop/credential_store.py publish-worker --home "$RUNNER_TEMP/codex-private-auth"
      - name: Remove private credential file
        if: always() && steps.restore.outcome == 'success'
        run: python3 .github/loop/credential_store.py remove --home "$RUNNER_TEMP/codex-private-auth"
